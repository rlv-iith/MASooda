# Shared baseline configuration from the MASooda workflow.
#
# Modules should load these values through one configuration loader instead of
# embedding simulation parameters in their own implementation.  
# P4 currently consumes only overseer_update_period; the remaining values are recorded now
# so the other owners can build against the same baseline.

simulation:
  num_agents: 60
  timestep_seconds: 0.1
  duration_seconds: 180.0
  random_seed: 42

communication:
  radius_meters: 40.0
  nearest_neighbors: 6
  mode: radius

control:
  velocity_time_constant_seconds: 0.5

scenario:
  type_mix: {EMERGENCY: 0.1, EVTOL: 0.3, DELIVERY: 0.6}

safety:
  minimum_separation_meters: 8.0
  maximum_velocity_meters_per_second: 15.0
  maximum_acceleration_meters_per_second_squared: 4.0
  detect_and_avoid_radius_meters: 30.0   # route mode: onboard sensing of drones without Remote ID

corridors:
  width_meters: 20.0
  capacity: 15
  count: 3
  centerline_spacing_meters: 50.0
  length_meters: 1500.0
  entry_zone_x_meters: [0.0, 100.0]
  merge_zone_x_meters: [700.0, 800.0]
  exit_zone_x_meters: [1400.0, 1500.0]

# Boids-style local behavior (P3 formulation, starting values tuned in Week 2).
local_behavior:
  v_cruise: 12.0   # m/s
  r_sep: 20.0      # m
  w_g: 1.0
  w_sep: 35.0      # Tuned in Week 3 to maintain >= 8.0 m minimum pairwise separation during multi-agent merges
  w_ali: 0.4
  w_coh: 0.1
  k_lat: 0.5       # 1/s
  look_ahead: 40.0 # m
  d_0: 12.0        # m
  h: 1.0           # s
  k_s: 0.3         # 1/s
  k_v: 0.5
  r_plat: 40.0     # m
  beta: 0.5
  merge_lateral_speed: 2.0 # m/s, max sideways speed while merging
  merge_gap: 15.0          # m, needed free gap along x in the target corridor
  junction_merge_zone_m: 40.0  # m, route mode: merge rule applies this far before a road junction

admm:
  tolerance: 0.001
  maximum_iterations: 50
  relative_tolerance: 0.0001
  rho: 1.0
  safety_margin_factor: 1.01
  iteration_sweep: [5, 10, 20, 50, 100]
  priority_weights: {0: 10.0, 1: 3.0, 2: 1.0}
  detection_radius_meters: 20.0
  merge_zone_only: true

overseer:
  update_period_seconds: 2.0
  default_policy: priority_aware
  link_failure:
    enabled: false
    down_start_seconds: 90.0
    down_end_seconds: 120.0

airspace:
  num_layers: 7
  layer_height_meters: 30.0
  emergency_layer: 6

stl:
  monitoring_period_seconds: 0.1
  window_steps: 10
  min_window_steps: 2

attack:
  enabled: false
  malicious_ids: []
  start_time_seconds: 60.0
  mode: constant             # constant or ramp
  delivery: common           # common or per_neighbor
  offset_magnitude_meters: 25.0
  ramp_rate_meters_per_second: 1.0
  direction_deg: null        # null: derived from the base seed
  sweep_offsets_meters: [5.0, 10.0, 25.0, 50.0]
  consensus_steps: 50

resilience:
  f: 1
  liar_counts: [1, 2]
  range_tolerance_meters: 3.0

experiments:
  seeds: [42, 43, 44]
  agent_counts: [30, 45, 60, 75]
  architectures: [hierarchical, centralized, decentralized_undefended]
  output_dir: outputs/week5
  week6:
    # While true, every Week 6 figure carries a "PROVISIONAL - pre-bug-fix" footer.
    provisional: true
    output_dir: outputs/week6
    ci_level: 0.95             # t-distribution CI on per-group means
    snapshot_period_s: 1.0     # fleet snapshot interval saved per run (frames/*.npz)
    # Deterministic dashboard demo (scripts/dashboard.py --scenario demo), 180 s:
    #   0-30 s corridor formation; ~30-90 s first merges in the merge zone; one
    #   emergency agent (rear-most, injected) throughout; malicious agent from
    #   t = 60 s; DTC (overseer) link down 90-120 s; recovery 120-180 s.
    demo_scenario:
      architecture: hierarchical
      n_agents: 60
      seed: 42
      duration_s: 180.0
      inject_emergency: true
      attack_start_s: 60.0
      link_down_s: [90.0, 120.0]
      clips:                     # [start_s, end_s] windows for the short clips
        formation_merge: [0.0, 75.0]
        emergency_priority: [40.0, 160.0]
        attack_dtc_outage: [55.0, 135.0]
    # --quick smoke-test shrink (applied on top of a matrix)
    quick:
      n_seeds: 1
      agent_counts: [12]
      duration_s: 20.0
      attack_start_s: 10.0     # only used by matrices with attack_enabled
      subdir: _quick           # outputs/week6/_quick/<matrix>
    default_group_by: [architecture, num_agents, attack_enabled, link_failure, emergency]
    default_metrics: [throughput_per_s, safety_violation_ticks, violation_episodes,
                      mean_recovery_time_s, min_robustness_m, min_separation_m,
                      admm_events, admm_nonconverged_frac]
    # "Weak" result groups (listed in weak_results.json, never auto re-run).
    weak:
      min_n: 3                 # fewer finite values than this -> weak
      max_cv: 0.5              # std/|mean| above this -> weak
    # Experiment matrices (Table 10). null -> experiments.seeds / agent_counts /
    # architectures; duration_s null -> simulation.duration_seconds.
    # admm_max_iterations / attack_offset_m equal to the config default are
    # stored as "default", so matrices that share a folder also share runs.
    matrices:
      e1:                      # E1 ADMM scaling (P2)
        output_subdir: e1_admm_scaling
        scenario: e1_admm_scaling
        architectures: [hierarchical]
        agent_counts: [30, 45, 60, 75]
        seeds: [42, 43, 44]
        duration_s: null
        group_by: [num_agents, admm_max_iterations]
      e1_iter:                 # E1 convergence vs iteration limit, N = 60
        output_subdir: e1_admm_scaling
        scenario: e1_admm_scaling
        architectures: [hierarchical]
        agent_counts: [60]
        seeds: [42, 43, 44]
        duration_s: null
        admm_max_iterations: [5, 10, 20, 50, 100]
        group_by: [num_agents, admm_max_iterations]
      e2:                      # E2 formation / merge / utilisation (P3)
        output_subdir: e2_formation
        scenario: e2_formation
        architectures: [hierarchical]
        agent_counts: [30, 45, 60, 75]
        seeds: [42, 43, 44]
        duration_s: null
        group_by: [num_agents]
      e3:                      # E3 emergency priority + paired control (P4)
        output_subdir: e3_priority
        scenario: e3_priority
        architectures: [hierarchical]
        agent_counts: [30, 45, 60, 75]
        seeds: [42, 43, 44]
        duration_s: null
        emergency: [true]
        emergency_control: [false, true]
        group_by: [num_agents, emergency_control]
      e4:                      # E4 resilience, attack off vs on (P5)
        output_subdir: e4_resilience
        scenario: e4_resilience
        architectures: [hierarchical, centralized, decentralized_undefended]
        agent_counts: [60]
        seeds: [42, 43, 44, 45, 46]
        duration_s: null
        attack_enabled: [false, true]
        group_by: [architecture, attack_enabled, attack_offset_m]
      e4_offset:               # E4 offset sensitivity (attack on)
        output_subdir: e4_resilience
        scenario: e4_resilience
        architectures: [hierarchical, centralized, decentralized_undefended]
        agent_counts: [60]
        seeds: [42, 43, 44]
        duration_s: null
        attack_enabled: [true]
        attack_offset_m: sweep  # -> attack.sweep_offsets_meters
        group_by: [architecture, attack_enabled, attack_offset_m]
      e5:                      # E5 extra nominal runs (only combinations E1-E4 lack)
        output_subdir: e5_stl
        scenario: e5_stl
        architectures: [centralized, decentralized_undefended]
        agent_counts: [30, 45, 60, 75]
        seeds: [42, 43, 44]
        duration_s: null
        group_by: [architecture, num_agents]
      e6:                      # E6 graceful degradation (P4 + P1)
        output_subdir: e6_degradation
        scenario: e6_degradation
        architectures: [hierarchical]
        agent_counts: [60]
        seeds: [42, 43, 44]
        duration_s: null
        link_failure: [false, true]
        group_by: [link_failure]

# Visualization-only settings (Week 6). Never read by the simulation
# (workflow 5.3), so changing them never changes a result.
visualization:
  dpi: 300                    # PNG resolution for saved figures
  font_family: DejaVu Sans    # ships with matplotlib on every platform
  font_size: 10
  title_size: 11
  figure_size: [6.4, 4.0]     # inches, single-panel default
  # Okabe-Ito / Tol colour-blind-safe palette. One fixed colour per
  # architecture and per agent type, used by every figure and the dashboard.
  colors:
    architectures:
      hierarchical: "#0072B2"
      centralized: "#E69F00"
      decentralized_undefended: "#009E73"
    agent_types:
      EMERGENCY: "#D55E00"
      EVTOL: "#56B4E9"
      DELIVERY: "#CC79A7"
    events:
      attack: "#AA3377"
      link_down: "#7F7F7F"
      violation: "#B2182B"
    threshold: "#000000"
    cycle: ["#0072B2", "#E69F00", "#009E73", "#D55E00", "#56B4E9", "#CC79A7", "#F0E442", "#000000"]
  labels:
    architectures:
      hierarchical: Hierarchical
      centralized: Centralized
      decentralized_undefended: Decentralized (undefended)
    events:
      attack: Attack active
      link_down: DTC link down
      violation: Safety violation
  provisional_footer: "PROVISIONAL - pre-bug-fix results"
  dashboard_refresh_ticks: 5  # --live: redraw the dashboard every N simulation ticks
  dashboard:
    figure_size: [15.0, 8.0]  # inches
    dpi: 100                  # dashboard frames / videos
    fps: 10                   # recorded GIF / MP4 frame rate
    frame_stride_ticks: 5     # recorded videos: one frame every N ticks (0.5 s at dt = 0.1)



# Live web demo (web_sandbox/server.py + simulation/route_engine.py).
# Server / browser limits and streaming settings. The spatial index never
# changes a result (tests/test_route_spatial.py), it only makes large fleets faster.
# Phase 4 DTC operator console (simulation/dtc_console.py).
dtc_console:
  outage_policy: queue           # queue | drop: commands sent while the DTC link is down
  queue_ttl_s: 30.0              # a queued command expires after this
  ground_now_max_pad_m: 800.0    # ground now: nearest pad within this route distance, else land in place
  hold_gain: 0.5                 # 1/s, loiter controller
  hold_max_speed: 3.0            # m/s
  hold_check_s: 60.0             # energy check for a hold: hold this long, then finish the route
  lost_link_default: continue    # continue | hold | rtb | land
  charge_c_rate: 2.0             # fast charge (1/h)
  charge_target_pct: 90.0
  swap_time_s: 90.0
  service_pad_capacity: 2        # drones served at once per battery-service pad; others queue (FIFO)

# Phase 5 repeated operations (route mode). Off by default; the long-duration preset turns it on.
operations:
  sorties: false                 # after landing, take a new mission from that pad
  turnaround_s: 30.0
  service_soc_pct: 35.0          # below this SoC the next sortie starts with a battery service
  service_mode: swap             # swap | charge
  service_roles: [depot]         # vertiport roles that have battery service

# Phase 3B drone health model (simulation/drone_health.py, docs/DRONE_HEALTH_MODEL.md).
drone_health:
  enabled: true
  ambient_c: 35.0              # Hyderabad pre-monsoon; heat-wave preset 42
  site_elevation_m: 542.0      # Hyderabad
  wind_mps: [0.0, 0.0]
  v_climb_mps: 3.0
  soc_min_pct: 5.0             # usable energy is counted down to this SoC
  random_fleet_soc_pct: [35.0, 100.0]   # seeded initial SoC of random-fleet drones
  random_fleet_soh_pct: [80.0, 100.0]
  alpha_r_per_k: 0.01          # internal resistance rise per K below 25 C
  cell_soc_sigma_pct: 0.4
  cell_r_sigma: 0.03
  bms_period_s: 0.5
  thresholds:
    soc_warning_pct: 30.0
    soc_critical_pct: 15.0
    cell_fault_v: 3.0
    pack_warning_c: 55.0
    pack_critical_c: 65.0
    pack_fault_c: 75.0
    motor_warning_c: 90.0
    motor_critical_c: 110.0
    imbalance_warning_mv: 50.0
    imbalance_critical_mv: 100.0
    current_warning_frac: 0.8
    hysteresis_soc_pct: 2.0
    hysteresis_c: 3.0
    hysteresis_mv: 10.0
  responses:
    check_period_s: 1.0
    reserve_margin: 0.2
    landing_time_s: 30.0
    overheat_speed_frac: 0.6
    overheat_critical_hold_s: 30.0
    dtc_unhealthy_priority: true    # CRITICAL/FAULT drones get right of way to land (section 8)
    sag_margin_v: 0.05              # feasibility: weakest cell must stay this far above cell_fault_v in a climb
    pad_hold_m: 60.0                # arrivals hold short this far from a pad reserved for a more urgent landing
    pad_reserve_radius_m: 150.0     # a reservation holds the pad once its drone is this close (route distance)
    critical_endurance_s: 120.0     # BMS CRITICAL/FAULT: assume the pack may fail within this time
    reservation_swap_s: 15.0        # a pad changes holder only if the challenger has this much less endurance
  link:
    p_tx_dbm: 27.0
    pl0_db: 40.0
    path_loss_exponent: 2.7
    shadowing_sigma_db: 4.0
    rssi50_dbm: -95.0
    loss_slope_db: 2.5
  gnss:
    hdop0: 0.9
    spoof_radius_m: 150.0
    spoof_hdop_gain: 3.0
  faults:
    capacity_loss_frac: 0.3
    cell_failure_soc_drop_pct: 15.0
    cell_failure_r_factor: 4.0
    overheating_heat_frac_hover: 0.6   # cell-venting precursor; 0.15 never reached WARNING on a 2-3 min campus flight
    motor_degradation_health: 0.8
    gnss_degradation_hdop: 5.0
  ocv_cell_v: [[0, 3.00], [5, 3.30], [10, 3.45], [20, 3.60], [40, 3.72], [60, 3.85], [80, 4.00], [100, 4.20]]
  types:
    DELIVERY:  {mass_kg: 6.0, payload_kg: 2.0, rotors: 4, rotor_diameter_m: 0.38, figure_of_merit: 0.65,
                eta_prop: 0.80, cda_m2: 0.08, avionics_w: 25.0, cells_series: 6, v_nominal: 22.2,
                capacity_wh: 500.0, r_pack_ohm: 0.020, c_max: 5.0, pack_c_j_per_k: 2500.0,
                pack_ha0: 3.0, pack_ha1: 1.0, motor_c_j_per_k: 400.0, motor_ha0: 5.0, motor_ha1: 2.0}
    EMERGENCY: {mass_kg: 10.0, payload_kg: 3.0, rotors: 6, rotor_diameter_m: 0.55, figure_of_merit: 0.65,
                eta_prop: 0.80, cda_m2: 0.12, avionics_w: 40.0, cells_series: 12, v_nominal: 44.4,
                capacity_wh: 800.0, r_pack_ohm: 0.040, c_max: 5.0, pack_c_j_per_k: 4000.0,
                pack_ha0: 3.0, pack_ha1: 1.0, motor_c_j_per_k: 600.0, motor_ha0: 6.0, motor_ha1: 2.5}
    EVTOL:     {mass_kg: 450.0, payload_kg: 100.0, rotors: 16, rotor_diameter_m: 1.5, figure_of_merit: 0.70,
                eta_prop: 0.85, cda_m2: 1.2, avionics_w: 500.0, cells_series: 108, v_nominal: 400.0,
                capacity_wh: 25000.0, r_pack_ohm: 0.050, c_max: 5.0, pack_c_j_per_k: 139000.0,
                pack_ha0: 60.0, pack_ha1: 25.0, motor_c_j_per_k: 20000.0, motor_ha0: 200.0, motor_ha1: 80.0}

web:
  max_fleet: 500                 # largest fleet a run may request (set from the Phase 1d benchmark)
  max_duration_s: 3600           # longest run a request may ask for
  realtime_max_fleet: 500        # largest fleet measured >= 1x real time (Phase 1d: 3.4x at 500 on a 2-vCPU Xeon 2.1 GHz); UI warns above it
  target_frames_per_sim_s: 5     # streamed frames per simulated second (dt 0.1 s -> every 2nd tick)
  max_kb_per_sim_s: 40           # adaptive stride: raise the stride if frames would exceed this budget
  est_bytes_per_drone_frame: 22  # compact-frame size estimate used by the adaptive stride
  max_frames_in_memory: 6000     # server and browser thin older frames beyond this (events are kept)
  max_edges_per_frame: 600       # V2V edges streamed per frame (evenly sampled above this)
  poll_batch: 400                # frames returned per /frames request
  spatial_index: true            # uniform-grid neighbour queries in the route engine
  grid_cell_m: 40.0
  interactive_lead_s: 5.0         # Phase 3: while a page is watching, the simulator stays at most this far
                                  # ahead of playback so operator commands land near the time on screen
  max_live_runs: 2                # live runs at once (shared CPU); a new run never stops one someone is watching
  abandon_after_s: 30.0           # a run no page has polled for this long is stopped to free its slot
  watcher_timeout_s: 5.0          # no poll for this long -> the simulator runs ahead freely              # grid cell size (comm radius is a good choice)

# Layer agreement (simulation/layer_agreement.py): drones negotiate cruise layers over V2V,
# the DTC seeds per-sector layer prices and settles stuck drones. Weights are dimensionless.
layer_agreement:
  enabled: true
  period_s: 1.0               # one negotiation round per second
  direction_parity: true      # semicircular rule: eastbound even layers, westbound odd layers
  # local cost J_i(L) = w_follow*phi + w_price*lambda + w_climb*climb + w_switch*[L != L_i] + w_direction*[wrong parity]
  w_follow: 1.0
  w_price: 0.6
  w_climb: 0.15
  w_switch: 0.25
  w_direction: 0.5
  battery_k: 1.0              # climbing costs (1 + k (1 - SoC)) more on a low battery
  climb_ref_m: 30.0
  gain_threshold: 0.15        # move only if the cost drops by more than this
  cooldown_s: 8.0             # no second layer change within this time
  # price consensus (dual ascent): lambda <- M(neighbour lambdas) + alpha (local load - target) / target
  alpha: 0.3
  target_load: 2              # drones per layer within V2V range before the price rises
  price_max: 2.0
  dtc_theta: 0.6              # DTC price starts rising above this fraction of sector-layer capacity
  # stuck -> DTC: below stuck_speed_frac x cruise for stuck_time_s (not on approach / held / capped)
  stuck_speed_frac: 0.6
  stuck_time_s: 4.0
  approach_m: 60.0
  request_ttl_s: 10.0
  # DTC cost: weight (1 + w_priority/(1+P)) (1 + w_battery (1-SoC)); K = delay + climb/SoC + load + switch
  dtc_w_delay: 1.0
  dtc_w_priority: 1.0
  dtc_w_battery: 0.5
  dtc_w_climb: 0.3
  dtc_w_load: 0.5
  dtc_w_switch: 0.1
  dtc_lookahead_m: 80.0
