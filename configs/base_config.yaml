# Shared baseline configuration from the MASooda workflow.
#
# Modules should load these values through one configuration loader instead of
# embedding simulation parameters in their own implementation.  
# P4 currently consumes only overseer_update_period; the remaining values are recorded now
# so the other owners can build against the same baseline.

simulation:
  num_agents: 60
  timestep_seconds: 0.1
  duration_seconds: 180.0
  random_seed: 42

communication:
  radius_meters: 40.0
  nearest_neighbors: 6

safety:
  minimum_separation_meters: 8.0
  maximum_velocity_meters_per_second: 15.0
  maximum_acceleration_meters_per_second_squared: 4.0

corridors:
  width_meters: 20.0
  capacity: 15
  count: 3
  centerline_spacing_meters: 50.0
  length_meters: 1500.0
  entry_zone_x_meters: [0.0, 100.0]
  merge_zone_x_meters: [700.0, 800.0]
  exit_zone_x_meters: [1400.0, 1500.0]

# Boids-style local behavior (P3 formulation, starting values tuned in Week 2).
local_behavior:
  v_cruise: 12.0   # m/s
  r_sep: 20.0      # m
  w_g: 1.0
  w_sep: 2.5
  w_ali: 0.4
  w_coh: 0.1
  k_lat: 0.5       # 1/s
  look_ahead: 40.0 # m
  d_0: 12.0        # m
  h: 1.0           # s
  k_s: 0.3         # 1/s
  k_v: 0.5
  r_plat: 40.0     # m
  beta: 0.5

admm:
  tolerance: 0.001
  maximum_iterations: 50
  relative_tolerance: 0.0001
  rho: 1.0
  safety_margin_factor: 1.01
  iteration_sweep: [5, 10, 20, 50, 100]

overseer:
  update_period_seconds: 2.0

stl:
  monitoring_period_seconds: 0.1

attack:
  enabled: false
  malicious_ids: []
  start_time_seconds: 60.0
  mode: constant             # constant or ramp
  delivery: common           # common or per_neighbor
  offset_magnitude_meters: 25.0
  ramp_rate_meters_per_second: 1.0
  direction_deg: null        # null: derived from the base seed

