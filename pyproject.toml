[project]
name = "masooda"
version = "0.1.0"
description = "Multi-Agent System for Hierarchical, Priority-Aware, and Resilient Urban Air Traffic Management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simulation", "config", "visualization", "verification", "conflict_resolution", "resilience"]
